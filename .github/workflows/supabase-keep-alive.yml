# Supabase's free plan pauses a project after about a week with no activity. This reads one row
# every three days so that does not happen. It uses the public anon key from assets/js/config.js,
# the same key every visitor's browser already uses, so no secret is needed.
name: Keep Supabase awake
on:
  schedule:
    - cron: "17 9 */3 * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read one post from the database
        run: |
          URL=$(sed -n 's/.*SUPABASE_URL = "\([^"]*\)".*/\1/p' assets/js/config.js)
          KEY=$(grep -o '"eyJ[^"]*"' assets/js/config.js | tr -d '"')
          curl --fail --silent --show-error --retry 3 --retry-delay 20 \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
            "$URL/rest/v1/updates?select=id&limit=1"
